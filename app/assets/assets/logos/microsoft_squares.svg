<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 21" width="21" height="21">
  <!-- The Microsoft logo's four squares, at Microsoft's own proportions
       (10-unit squares, 1-unit gutter) and official hexes. The squares are the
